services:
  maacare:
    image: alifahmaddev/maacare:latest
    container_name: maacare
    restart: unless-stopped
    ports:
      - "${MAACARE_PORT:-3000}:3000"
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/app/version').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
