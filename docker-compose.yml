# Local MongoDB + Qdrant for auth and RAG development.
# Usage: docker compose up -d
# Then copy .env.example → .env and set AUTH_SECRET + OPENAI_API_KEY.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - maacare_mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - maacare_qdrant_data:/qdrant/storage

volumes:
  maacare_mongo_data:
  maacare_qdrant_data:
